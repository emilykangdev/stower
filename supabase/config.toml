# Supabase project config. Only the per-function override this slice needs is set
# here; everything else uses Supabase defaults. Run `supabase init` to scaffold the
# full file (project_id, db, auth, …) when linking the real project.
#
# The `license` function must skip the gateway JWT check. Both of its callers carry
# NO Supabase JWT: Lemon Squeezy's `order_created` webhook (an external server) and
# the macOS app's anonymous `mint-trial` call. With the default verify_jwt = true,
# Supabase's gateway would 401 them before they ever reach Deno, breaking the whole
# upgrade + trial flow. Security for the webhook is the in-handler Lemon Squeezy
# HMAC signature check (handlers.ts); the mint-trial abuse control is the tracked
# pre-launch must-fix (B1), out of scope for this slice.
[functions.license]
verify_jwt = false
