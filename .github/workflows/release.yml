name: Release

on:
  push:
    tags:
      - "messages-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 0.1.0) — dry-run only, no publish"
        required: true
        default: "0.0.0-dry"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release

    steps:
      - name: Checkout
        # actions/checkout v5 (SHA-pinned per supply-chain hardening). v5 runs on
        # Node 24; the prior v4 pin targeted deprecated Node 20.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - name: Parse version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # A real publish is ALWAYS a tag push (the `push` trigger is scoped to
          # messages-v* tags); workflow_dispatch is dry-run only. Gate on the
          # event, not github.ref_type — a workflow_dispatch can target a tag ref,
          # which would otherwise be misread as a publish.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#messages-v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$'; then
            echo "ERROR: version '$VERSION' does not match expected SemVer format (e.g. 1.2.3 or 1.2.3-dry)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Derive build number
        id: build
        env:
          PAGES_BRANCH: gh-pages
        run: |
          PREV_BUILD=0
          if git fetch origin "$PAGES_BRANCH" 2>/dev/null; then
            APPCAST="$(git show "origin/$PAGES_BRANCH:messages/appcast.xml" 2>/dev/null || true)"
            if [ -n "$APPCAST" ]; then
              PREV_BUILD="$(echo "$APPCAST" \
                | grep -Eo '<sparkle:version>[0-9]+</sparkle:version>' \
                | grep -Eo '[0-9]+' \
                | sort -n \
                | tail -1 \
                || echo "0")"
              PREV_BUILD="${PREV_BUILD:-0}"
              PREV_ITEM_COUNT="$(echo "$APPCAST" | (grep -c '<item>' || true))"
            fi
          fi
          BUILD="$((PREV_BUILD + 1))"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "prev_build=$PREV_BUILD" >> "$GITHUB_OUTPUT"
          echo "prev_item_count=${PREV_ITEM_COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "Build number: $BUILD (previous: $PREV_BUILD)"

      - name: Import Developer ID certificate to temp keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          # Publish KEYCHAIN_PATH to the job env BEFORE any failable step below, so
          # the `if: always()` cleanup step can always delete the temp keychain even
          # if `security import` fails partway through.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Prepend the temp keychain to the user search list WITHOUT collapsing the
          # existing keychains into one argument. `security list-keychains` prints one
          # quoted, indented path per line; read each into an array so every existing
          # keychain is passed to `-s` as its own argument (a quoted command
          # substitution would merge them into a single malformed argument).
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc="$(printf '%s' "$kc" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/"//g')"
            [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/StowerMac.xcarchive"
          xcodebuild archive \
            -project StowerMac/StowerMac.xcodeproj \
            -scheme StowerMac \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$NOTARY_TEAM_ID"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export archive
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist Scripts/release/ExportOptions.plist
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

      - name: Discover exported app name
        run: |
          FULL_PRODUCT_NAME="$(xcodebuild \
            -project StowerMac/StowerMac.xcodeproj \
            -scheme StowerMac \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | awk '/[[:space:]]FULL_PRODUCT_NAME = /{print $3}')"
          APP_PATH="$EXPORT_DIR/$FULL_PRODUCT_NAME"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: expected app at $APP_PATH — FULL_PRODUCT_NAME=$FULL_PRODUCT_NAME" >&2
            ls "$EXPORT_DIR" >&2
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "FULL_PRODUCT_NAME=$FULL_PRODUCT_NAME" >> "$GITHUB_ENV"
          echo "App path: $APP_PATH"

      - name: Pre-notarize gate — hardened runtime + Developer ID identity
        run: |
          CS_INFO="$(codesign -dvvv "$APP_PATH" 2>&1)"
          echo "$CS_INFO"
          EXPECTED_RUNTIME="runtime"
          EXPECTED_IDENTITY="Developer ID Application"
          if ! echo "$CS_INFO" | grep -q "$EXPECTED_RUNTIME"; then
            echo "ERROR: hardened runtime flag not found in codesign output." >&2
            echo "Expected to find: $EXPECTED_RUNTIME" >&2
            exit 1
          fi
          if ! echo "$CS_INFO" | grep -q "$EXPECTED_IDENTITY"; then
            echo "ERROR: Developer ID Application identity not found in codesign output." >&2
            echo "Expected to find: $EXPECTED_IDENTITY" >&2
            exit 1
          fi
          echo "Runtime and identity gate: PASSED"

      - name: Pre-notarize gate — Sparkle.framework signature (no --deep)
        run: |
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$SPARKLE_FW" ]; then
            echo "ERROR: Sparkle.framework not found at $SPARKLE_FW" >&2
            exit 1
          fi
          codesign --verify --strict "$SPARKLE_FW"
          echo "Sparkle.framework signature gate: PASSED"

      - name: Pre-notarize gate — SUFeedURL in built Info.plist
        run: |
          BUILT_PLIST="$APP_PATH/Contents/Info.plist"
          EXPECTED_URL="https://updates.stower.app/messages/appcast.xml"
          ACTUAL_URL="$(/usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$BUILT_PLIST" 2>/dev/null || true)"
          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "ERROR: SUFeedURL mismatch in built Info.plist." >&2
            echo "  Expected: $EXPECTED_URL" >&2
            echo "  Actual:   ${ACTUAL_URL:-<absent>}" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :SUEnableAutomaticChecks" "$BUILT_PLIST" 2>/dev/null; then
            echo "ERROR: SUEnableAutomaticChecks must NOT be set in Info.plist (consent-first UX)." >&2
            exit 1
          fi
          echo "Info.plist gates: PASSED (SUFeedURL correct, SUEnableAutomaticChecks absent)"

      - name: Zip (pre-notarize, before staple)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP_NAME="StowerMac-${VERSION}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Notarize
        id: notarize
        # Notarization runs on BOTH dry-run and real release. Apple has no "dry
        # run": notarytool either notarizes a build or it doesn't, and doing so
        # is NOT a publish action (no Release, no appcast) — it just proves the
        # build is notarizable, which is exactly what a dry-run must catch before
        # a real tag. Only the publish steps below gate on `push`. If this 403s
        # with "a required agreement is missing or has expired", accept the
        # pending Apple Developer Program License Agreement at developer.apple.com;
        # a real release would fail identically, so a red dry-run is correct signal.
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          SUBMISSION_OUTPUT="$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait \
            --output-format json)"
          echo "$SUBMISSION_OUTPUT"
          SUBMISSION_ID="$(echo "$SUBMISSION_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          STATUS="$(echo "$SUBMISSION_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            echo "ERROR: Notarization status is '$STATUS', expected 'Accepted'." >&2
            exit 1
          fi
          echo "Notarization: ACCEPTED (id=$SUBMISSION_ID)"

      - name: Dump notarytool log on failure
        if: failure() && steps.notarize.outputs.submission_id != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.notarize.outputs.submission_id }}
        run: |
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" || true

      - name: Staple
        run: |
          xcrun stapler staple "$APP_PATH"
          echo "Staple: DONE"

      - name: Re-zip stapled app (single artifact)
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "Stapled zip: $ZIP_PATH"

      - name: Post-notarize gate — Gatekeeper + stapler validate
        run: |
          spctl -a -vvv "$APP_PATH" 2>&1
          if ! spctl -a -vvv "$APP_PATH" 2>&1 | grep -q "accepted"; then
            echo "ERROR: spctl -a -vvv did not produce 'accepted'." >&2
            exit 1
          fi
          xcrun stapler validate "$APP_PATH"
          echo "Post-notarize gates: PASSED"

      - name: Delete temp keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && security list-keychains | grep -q "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH"
            echo "Temp keychain deleted."
          fi

      - name: Stop here for dry-run (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry-run complete: notarized + stapled artifact at $ZIP_PATH"
          echo "Validated: archive, export, signing gates, notarize, staple, Gatekeeper."
          echo "Skipped (real releases only): GitHub Release + appcast publish."
          exit 0

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          echo "## Stower ${VERSION}" > "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "See [release notes](https://updates.stower.app/messages/notes/${VERSION}.html) for details." >> "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP_PATH" \
            --title "Stower $VERSION" \
            --notes-file "$NOTES_FILE"
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP_NAME"
          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"

      - name: Sign update and amend appcast
        if: github.event_name == 'push'
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          PAGES_BRANCH: gh-pages
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          PREV_ITEM_COUNT: ${{ steps.build.outputs.prev_item_count }}
          # Must match the Sparkle version resolved in StowerMac.xcodeproj's
          # Package.resolved — sign_update has to match the framework that verifies.
          SPARKLE_VERSION: "2.9.3"
        run: |
          # sign_update ships in Sparkle's official release tarball under bin/. The
          # Homebrew cask only installs "Sparkle Test App.app" (no bin/ tools), so
          # fetch the version-matched distribution archive directly for a
          # deterministic, offline-from-brew tool source.
          SPARKLE_TOOLS="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$SPARKLE_TOOLS"
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$SPARKLE_TOOLS"
          SIGN_UPDATE="$SPARKLE_TOOLS/bin/sign_update"
          if [ ! -x "$SIGN_UPDATE" ]; then
            echo "ERROR: sign_update not found at $SIGN_UPDATE after extracting Sparkle ${SPARKLE_VERSION}." >&2
            exit 1
          fi

          KEY_FILE_EDDSA="$RUNNER_TEMP/sparkle_eddsa_key.txt"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE_EDDSA"
          SIGN_OUTPUT="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE_EDDSA" "$ZIP_PATH")"
          rm "$KEY_FILE_EDDSA"
          # sign_update 2.x outputs: sparkle:edSignature="<base64>" length="<N>"
          # Extract just the base64 value for embedding in the XML attribute.
          ED_SIGNATURE="$(echo "$SIGN_OUTPUT" | grep -Eo 'sparkle:edSignature="[^"]*"' | head -1 | sed 's/sparkle:edSignature="//;s/"$//')"
          if [ -z "$ED_SIGNATURE" ]; then
            echo "ERROR: sign_update produced no recognisable edSignature." >&2
            echo "sign_update raw output: $SIGN_OUTPUT" >&2
            exit 1
          fi

          FILE_SIZE="$(stat -f '%z' "$ZIP_PATH")"
          ROLLOUT_INTERVAL="86400"
          NOTES_URL="https://updates.stower.app/messages/notes/${VERSION}.html"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$PAGES_BRANCH"
          git worktree add "$RUNNER_TEMP/pages" "origin/$PAGES_BRANCH"

          APPCAST_PATH="$RUNNER_TEMP/pages/messages/appcast.xml"
          NOTES_DIR="$RUNNER_TEMP/pages/messages/notes"
          mkdir -p "$(dirname "$APPCAST_PATH")" "$NOTES_DIR"

          if [ ! -f "$APPCAST_PATH" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' \
              '  <channel>' \
              '    <title>Stower Updates</title>' \
              '    <link>https://updates.stower.app/messages/appcast.xml</link>' \
              '    <description>Stower for Messages update feed</description>' \
              '    <language>en</language>' \
              '  </channel>' \
              '</rss>' > "$APPCAST_PATH"
          fi

          APPCAST_PATH="$APPCAST_PATH" VERSION="$VERSION" BUILD="$BUILD" \
            PUB_DATE="$PUB_DATE" NOTES_URL="$NOTES_URL" ASSET_URL="$ASSET_URL" \
            FILE_SIZE="$FILE_SIZE" ED_SIGNATURE="$ED_SIGNATURE" ROLLOUT_INTERVAL="$ROLLOUT_INTERVAL" \
            python3 "$GITHUB_WORKSPACE/Scripts/release/amend_appcast.py"

          NEW_ITEM_COUNT="$(grep -c '<item>' "$APPCAST_PATH" || true)"
          if [ "$NEW_ITEM_COUNT" -lt "$PREV_ITEM_COUNT" ]; then
            echo "ERROR: appcast item count decreased from $PREV_ITEM_COUNT to $NEW_ITEM_COUNT — feed must never shrink." >&2
            exit 1
          fi
          echo "Appcast item count: $NEW_ITEM_COUNT (previous: $PREV_ITEM_COUNT)"

          NOTES_HTML="$NOTES_DIR/${VERSION}.html"
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="en">' \
            "<head><meta charset=\"utf-8\"><title>Stower ${VERSION}</title></head>" \
            '<body>' \
            "<h2>Stower ${VERSION}</h2>" \
            "<p>See the <a href=\"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}\">GitHub Release</a> for details.</p>" \
            '</body>' \
            '</html>' > "$NOTES_HTML"

          cd "$RUNNER_TEMP/pages"
          git add messages/appcast.xml "messages/notes/${VERSION}.html"
          git commit -m "release: Stower Messages ${VERSION} (build ${BUILD})"
          git push origin "HEAD:$PAGES_BRANCH"
          echo "Appcast pushed to $PAGES_BRANCH."
