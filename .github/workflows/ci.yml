name: CI
on: [push, pull_request]
jobs:
  build:
    # macos-26 (NOT macos-15): StowerMac requires macOS 26 (it uses FoundationModels /
    # on-device Apple Intelligence; the Xcode app's MACOSX_DEPLOYMENT_TARGET = 26.4), so
    # macos-15 cannot build OR run it. macos-15's newest Xcode (26.3) ships only the
    # macOS 26.2 SDK — below the 26.4 deployment target — so an `xcodebuild archive`
    # fails there. macos-26 (default Xcode 26.5, SDK 26.5) builds it and matches local
    # dev. Verified against GitHub runner-images manifests (2026-06-28).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Select the latest stable Xcode on the macos-26 runner. This pins a full
      # Swift 6.x toolchain with Swift Testing bundled — swift-actions/setup-swift
      # does not publish exact patch releases like 6.3.1, so we use the runner's
      # Xcode-provided toolchain instead (which is >= our local 6.3.1 in features).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Install lint tools
        run: brew install swift-format swiftlint
      # The precheck gate now runs the license Edge Function's Deno tests
      # (Step 4c). They fail hard if Deno is absent, so CI must provide it —
      # otherwise the gate would go permanently red on the runner.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Run the SAME gate as the local pre-commit hook so CI and local stay in
      # lockstep — one definition of "green". Any check added to precheck.sh
      # (swift-format, swiftlint, build, test, module-boundary, and future greps a
      # harden-guardrail pass may add) is then enforced in CI automatically, with
      # no second place to keep in sync. The ONE deliberate divergence is the
      # FoundationModels integration suite below: it exercises the REAL on-device
      # model, which needs Apple Intelligence provisioned (models downloaded +
      # enabled). The macos-26 runner IS macOS 26, but it's a CI VM with no Apple
      # Intelligence provisioned, so the suite would still fail-hard here.
      # STOWER_SKIP_FM_INTEGRATION=1 excludes ONLY that suite in CI; every other
      # test still runs fail-hard, and the suite runs for real on the local dev
      # machine where the var is unset. Revisit (drop this env) if/when GitHub
      # provisions Apple Intelligence on the runner — worth a one-off test.
      - name: Run precheck gate
        env:
          STOWER_SKIP_FM_INTEGRATION: "1"
        run: ./Scripts/precheck.sh
      # Build the StowerMac Xcode app target (no signing) so that Xcode-project-
      # only code — StowerUpdaterController.swift, StowerUpdaterSettingsView.swift,
      # Sparkle SPM linkage, and StowerMacApp.swift wiring — is compiled on every
      # push/PR. precheck.sh runs `swift build` over the SPM graph (Sources/,
      # Tests/) but never touches StowerMac/StowerMac.xcodeproj; without this step
      # a broken Sparkle API call would only surface at `xcodebuild archive` time
      # during a release tag run. CODE_SIGNING_ALLOWED=NO avoids needing any
      # Developer ID cert in CI. -skipPackagePluginValidation suppresses plugin
      # sandbox warnings that are irrelevant in a build-only context.
      # Cache the SwiftPM dependencies xcodebuild clones for StowerMac.xcodeproj
      # (Sparkle + its transitive deps), keyed by the Xcode project's Package.resolved.
      # -clonedSourcePackagesDirPath below pins the clone location to this cached dir,
      # so an unchanged resolution skips the network re-resolve on every CI run.
      - name: Cache StowerMac SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stowermac-spm
          key: stowermac-spm-${{ runner.os }}-${{ hashFiles('StowerMac/StowerMac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            stowermac-spm-${{ runner.os }}-
      - name: Build StowerMac app target (no signing)
        run: |
          xcodebuild build \
            -project StowerMac/StowerMac.xcodeproj \
            -scheme StowerMac \
            -configuration Debug \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/stowermac-spm" \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation
      # Release-config build: proves the `#if DEBUG` seams compile OUT of a Release
      # binary. precheck's Step 3 `swift build` is Debug (DEBUG defined), so a
      # reference to a `#if DEBUG`-only symbol from non-debug code passes locally
      # yet would break — or silently ship a debug-only lever into — the Release
      # app. This step turns that into a hard CI failure. Kept OUT of the per-commit
      # precheck hook on purpose (a full release build ~doubles build time); CI is
      # the right altitude, alongside the FM-suite and keygen-integration divergences.
      - name: Release-config build (debug seams must compile out)
        run: swift build -c release

  # Licensing integration tier: stands up a real local Keygen CE and runs the Deno
  # integration suite against it, proving our JSON:API payloads + the offline
  # machine path for real (the check that would have caught the `page[number]` bug
  # before it shipped). SEPARATE from the macOS `build` job ON PURPOSE: `keygen/api`
  # is an x86_64 image, native here on ubuntu but emulated (slow/flaky) on the
  # macos-15 arm64 runner. This tier is excluded from `precheck` (the per-commit
  # gate stays fast + Docker-free) and runs only here.
  #
  # NOTE: make this a REQUIRED status check in branch protection so nothing touching
  # the licensing API merges without real-CE regression proof (Emily's payments bar).
  keygen-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Boot Keygen CE harness
        run: Scripts/Keygen/up.sh
      - name: Run licensing integration tests
        working-directory: Scripts/Keygen
        run: deno task test:integration
      - name: Tear down harness
        if: always()
        run: Scripts/Keygen/down.sh
