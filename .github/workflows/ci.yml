name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Select the latest stable Xcode on the macos-15 runner. This pins a full
      # Swift 6.x toolchain with Swift Testing bundled — swift-actions/setup-swift
      # does not publish exact patch releases like 6.3.1, so we use the runner's
      # Xcode-provided toolchain instead (which is >= our local 6.3.1 in features).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Install lint tools
        run: brew install swift-format swiftlint
      - run: swift build
      - run: swift test
      - run: swift-format lint --strict --recursive Sources Tests
      - run: swiftlint lint --strict
      - name: Module boundary check
        run: |
          # Match only real Swift import declarations (anchored, optional
          # @testable) in *.swift files, so docs/comments mentioning an import
          # cannot trip a false-positive failure.
          if grep -RInE --include="*.swift" '^[[:space:]]*(@testable[[:space:]]+)?import[[:space:]]+(StowerPhotos|StowerMessages)([[:space:]]|\.|$)' Sources/StowerCore/ 2>/dev/null; then
            echo "ERROR: StowerCore must not import StowerPhotos or StowerMessages"
            exit 1
          fi
          if grep -RInE --include="*.swift" '^[[:space:]]*(@testable[[:space:]]+)?import[[:space:]]+StowerMessages([[:space:]]|\.|$)' Sources/StowerPhotos/ 2>/dev/null; then
            echo "ERROR: StowerPhotos must not import StowerMessages"
            exit 1
          fi
          if grep -RInE --include="*.swift" '^[[:space:]]*(@testable[[:space:]]+)?import[[:space:]]+StowerPhotos([[:space:]]|\.|$)' Sources/StowerMessages/ 2>/dev/null; then
            echo "ERROR: StowerMessages must not import StowerPhotos"
            exit 1
          fi
